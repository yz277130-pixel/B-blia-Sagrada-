<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183b32">
<meta name="description" content="Leitor digital da Bíblia Ave-Maria.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Bíblia Ave-Maria — Leitor</title>
</head>
<body>
<header class="topbar">
  <button id="menuBtn" class="iconbtn" aria-label="Abrir índice">☰</button>
  <div class="brand"><span class="cross">✝</span><div><strong>Bíblia Ave-Maria</strong><small>Leitor digital</small></div></div>
  <button id="themeBtn" class="iconbtn" aria-label="Alternar aparência" title="Alternar claro, sépia e escuro">◐</button>
</header>
<div class="toolbar">
  <button id="prevBtn" class="toolbtn" aria-label="Página anterior">‹ Anterior</button>
  <label class="pagejump">Página <input id="pageInput" type="number" min="1" value="1" inputmode="numeric"> <span id="pageTotal">/ —</span></label>
  <button id="nextBtn" class="toolbtn" aria-label="Próxima página">Próxima ›</button>
</div>
<div class="progress" aria-label="Progresso de leitura"><div id="progressFill"></div></div>
<main id="reader" tabindex="-1"><div class="loading">Carregando o conteúdo…</div></main>
<footer class="bottomtools">
  <button id="smallerBtn" class="toolbtn" aria-label="Diminuir letra">A−</button>
  <span id="fontLabel">100%</span>
  <button id="biggerBtn" class="toolbtn" aria-label="Aumentar letra">A+</button>
  <select id="fontFamily" aria-label="Tipo de letra">
    <option value="serif">Serifada</option><option value="sans">Sem serifa</option>
  </select>
  <button id="bookmarkBtn" class="toolbtn">☆ Favoritar</button>
  <button id="notesBtn" class="toolbtn">✎ Anotar</button>
  <button id="favoritesBtn" class="toolbtn">★ Favoritos</button>
</footer>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawerhead"><strong>Índice e ferramentas</strong><button id="closeMenu" class="iconbtn" aria-label="Fechar">×</button></div>
  <div class="searchrow"><input id="searchInput" type="search" placeholder="Buscar palavra ou trecho…" autocomplete="off"><button id="searchBtn">Buscar</button></div>
  <div id="searchStatus" class="hint" aria-live="polite"></div>
  <h3>Aparência</h3>
  <label class="setting">Brilho da leitura <input id="brightness" type="range" min="70" max="120" value="100"></label>
  <p class="hint">Use o botão ◐ no topo para alternar entre claro, sépia e escuro.</p>
  <h3>Ir para uma parte</h3><div id="tocLinks" class="toclinks"></div>
  <h3>Livros bíblicos</h3><div id="bookLinks" class="booklinks"></div>
  <h3>Favoritos e busca</h3><div id="results" class="results"></div>
</aside>
<div id="scrim" class="scrim"></div>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
